<section class="band band--dark" id="contato">
  <div class="wrap">
    <p class="eyebrow reveal">Contato</p>
    <h2 class="h-lg reveal" style="--d: 0.08s">Venha nos conhecer.</h2>

    <div class="contact" style="margin-top: clamp(2.5rem, 6vw, 4rem)">
      <div class="map reveal">
        <div class="map__canvas">
          <iframe
            title="Mapa: Av. Eng. Carlos Goulart, 931 — Belo Horizonte, MG"
            src="https://maps.google.com/maps?q=Espa%C3%A7o%20Intimista%2C%20Av.%20Eng.%20Carlos%20Goulart%2C%20931%2C%20Buritis%2C%20Belo%20Horizonte%20-%20MG&amp;z=16&amp;output=embed"
            loading="lazy"
            referrerpolicy="no-referrer-when-downgrade"
          ></iframe>
        </div>

        <!-- o pino do embed fica cinza sob o filtro; este, por cima e fora
             dele, é o nosso — dourado, na cor da marca -->
        <svg class="map__pin" viewBox="0 0 32 44" aria-hidden="true">
          <path
            d="M16 42.5S3.5 26 3.5 16a12.5 12.5 0 1 1 25 0c0 10-12.5 26.5-12.5 26.5z"
            fill="var(--brasa)"
            stroke="var(--noite)"
            stroke-width="1.6"
          />
          <circle cx="16" cy="16" r="5" fill="var(--noite)" />
        </svg>
      </div>

      <div class="reveal" style="--d: 0.1s">
        <div class="contact__block">
          <p class="contact__label">Endereço</p>
          <address>
            Av. Eng. Carlos Goulart, 931<br />
            Buritis · Belo Horizonte, MG
          </address>
          <p style="margin-top: 0.6rem">
            <a
              href="https://www.google.com/maps/search/?api=1&amp;query=Espa%C3%A7o%20Intimista%2C%20Av.%20Eng.%20Carlos%20Goulart%2C%20931%2C%20Buritis%2C%20Belo%20Horizonte%20-%20MG"
              target="_blank"
              rel="noopener"
              >Abrir no Google Maps</a
            >
          </p>
        </div>
        <div class="contact__block">
          <p class="contact__label">E-mail</p>
          <p>
            <a href="mailto:contato@intimistagourmet.com.br"
              >contato@intimistagourmet.com.br</a
            >
          </p>
        </div>
        <div class="contact__block">
          <p class="contact__label">Instagram</p>
          <p>
            <a
              href="https://www.instagram.com/intimista_gourmet/"
              target="_blank"
              rel="noopener"
              >@intimista_gourmet</a
            >
          </p>
        </div>
        <div class="contact__block">
          <p class="contact__label">Visitas</p>
          <p style="color: var(--luz-fraca)">
            Agende um horário para conhecer os ambientes pessoalmente.
          </p>
        </div>
      </div>
    </div>

    <!-- include: sections/footer.html -->
  </div>
</section>
